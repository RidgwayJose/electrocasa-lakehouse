bundle:
  name: electrocasa-lakehouse

include:
  - resources/*.yml

variables:
  catalog_name:
    description: "Nombre del catalogo Unity Catalog destino"
    default: electrocasa_dev

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-91723c77-f009.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: electrocasa_dev

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: electrocasa_prod
