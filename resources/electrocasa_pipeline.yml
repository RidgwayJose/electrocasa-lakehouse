resources:
  pipelines:
    electrocasa_pipeline:
      name: "[${bundle.target}] electrocasa_medallion_pipeline"
      catalog: ${var.catalog_name}
      schema: bronze
      serverless: true
      root_path: ../src
      libraries:
        - glob:
            include: ../src/electrocasa/transformations/**
      configuration:
        catalog_name: ${var.catalog_name}
        bronze_schema: bronze
        silver_schema: silver
        gold_schema: gold
